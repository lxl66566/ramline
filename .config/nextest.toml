[profile.default]
slow-timeout = { timeout = "60s", terminate-after = 2 }

# Live ETW tests spawn real process trees and wait out the ~1 s ETW flush
# latency plus the engine grace window.
[[profile.default.overrides]]
filter = 'test(etw_tests)'
slow-timeout = { period = "60s", timeout = "120s", terminate-after = 2 }
