[package]
name         = "ramline"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
description  = "Event-driven memory monitor for a command and its spawned process tree"
homepage     = "https://github.com/lxl66566/ramline"
repository   = "https://github.com/lxl66566/ramline"
license      = "MIT OR Apache-2.0"
keywords     = ["memory", "rss", "monitor", "profiler", "cli"]
categories   = ["command-line-utilities"]
include      = ["/CHANGELOG.md", "/LICENSE-*", "/README.md", "/benches/**", "/src/**", "/tests/**"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
crossfire = "3.1.23"
ferrisetw2 = "2.0.0"
log = "0.4.35"
plotters = { version = "0.3.7", default-features = false, features = ["line_series", "svg_backend"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spdlog-rs = { version = "0.5.3", features = ["flexible-string", "log"] }
thiserror = "2.0.21"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_Debug", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[features]
# Live ETW integration tests (src/etw_tests.rs). Creating an ETW trace
# session requires elevation; run these tests as administrator.
admin-tests = []

[lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
wildcard_imports        = "allow"

[lints.rust]
unsafe_code           = "allow"
unused_qualifications = "warn"

[lints.cargo]
# homepage is required explicitly even though it matches repository
redundant_homepage = "allow"

[profile.release]
lto       = true
opt-level = "s"
strip     = true

[dev-dependencies]
tempfile = "3.27.0"
