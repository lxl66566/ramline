[package]
name    = "ramline-ebpf"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aya-ebpf           = "0.3.0"
ramline-ebpf-common = { path = "../ramline-ebpf-common" }

[build-dependencies]
which = "6.0.0"

# Bin name `ramline`: aya-build copies the built object to
# $OUT_DIR/ramline of the userspace crate.
[[bin]]
name = "ramline"
path = "src/main.rs"
